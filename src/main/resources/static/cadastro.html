<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum | Cadastro</title>
    <link rel="icon" type="image/png" href="img/aurum-favicon.png">
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
<div class="cadastro-container">
    <div class="logo">
        <img
                src="img/aurum-logo.png"
                alt="Logo da Aurum"
                class="logo-img"
        >
    </div>
    <h1>Crie sua Conta</h1>
    <p class="subtitulo">
        Comece a organizar sua vida financeira
    </p>
    <form id="cadastro-form">
        <div class="input-group">
            <label for="nome">
                Nome
            </label>
            <input
                    id="nome"
                    name="nome"
                    type="text"
                    placeholder="Digite seu nome"
            >
        </div>
        <div class="input-group">
            <label for="identificador">
                Identificador
            </label>
            <input
                    id="identificador"
                    name="identificador"
                    type="text"
                    placeholder="E-mail ou nome de usuário"
            >
        </div>
        <div class="input-group">
            <label for="senha">
                Senha
            </label>
            <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Digite sua senha"
            >
        </div>
        <div class="input-group">
            <label for="confirmarSenha">
                Confirmar Senha
            </label>
            <input
                    id="confirmarSenha"
                    name="confirmarSenha"
                    type="password"
                    placeholder="Confirme sua senha"
            >
        </div>
        <button type="submit">
            Cadastrar
        </button>
        <p id="mensagem"></p>
    </form>
    <div class="login-link">
        Já possui uma conta?
        <a href="index.html">
            Entrar
        </a>
    </div>
</div>
<script src="js/cadastro.js"></script>

</body>

</html>
