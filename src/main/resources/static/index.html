<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurum | Login</title>
    <link rel="icon" type="image/png" href="img/aurum-favicon.png">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="dark">
<div class="login-container">
    <div class="logo">
        <img
                src="img/aurum-logo.png"
                alt="Aurum"
                class="logo-img"
                draggable="false"
        >
    </div>
    <h1>Bem-vindo</h1>
    <p class="subtitulo">
        Faça login para continuar
    </p>
    <form id="login-form">
        <div class="input-group">
            <label for="identificador">
                Identificador
            </label>
            <input
                    id="identificador"
                    name="identificador"
                    type="text"
                    placeholder="E-mail ou nome de usuário"
            >
        </div>
        <div class="input-group">
            <label for="senha">
                Senha
            </label>
            <input
                    id="senha"
                    name="senha"
                    type="password"
                    placeholder="Digite sua senha"
            >
        </div>
        <button type="submit">
            Entrar
        </button>
    </form>

    <div id="mensagem"></div>

    <div class="cadastro-link">
        Não possui conta?
        <a href="cadastro.html">
            Cadastrar
        </a>
    </div>
</div>

<script src="js/tema.js"></script>
<script src="js/login.js"></script>

</body>

</html>
