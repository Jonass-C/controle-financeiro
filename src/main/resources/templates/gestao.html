<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestão Financeira</title>

    <link rel="stylesheet" href="../static/css/gestao.css">
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <header>

        <h1>Gestão Financeira</h1>

        <div class="usuario" id="usuario-nome">
            Olá
        </div>

    </header>

    <!-- RESUMO FINANCEIRO -->

    <section class="resumo-financeiro">

        <div class="card">
            <h2>Saldo Atual</h2>
            <p>R$ 2.340,00</p>
        </div>

        <div class="card">
            <h2>Ganhos</h2>
            <p>R$ 4.500,00</p>
        </div>

        <div class="card">
            <h2>Gastos</h2>
            <p>R$ 2.160,00</p>
        </div>

    </section>

    <!-- BOTÃO -->

    <section class="acoes">

        <button id="abrir-modal">
            + Adicionar Transação
        </button>

    </section>

    <!-- LISTA DE TRANSAÇÕES -->

    <section class="lista-transacoes">

        <h2>Transações</h2>

        <table>

            <thead>
            <tr>
                <th>Nome</th>
                <th>Data</th>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Ações</th>
            </tr>
            </thead>

            <tbody id="tabela-transacoes">

            <tr>
                <td>Salário</td>
                <td data-data="2026-05-26">
                    26/05/2026
                </td>
                <td>Trabalho</td>
                <td>Lucro</td>
                <td>R$ 3000</td>

                <td>
                    <button class="editar">Editar</button>
                    <button class="excluir">Excluir</button>
                </td>
            </tr>

            <tr>
                <td>Mercado</td>
                <td data-data="2026-04-25">
                    25/04/2026
                </td>
                <td>Alimentação</td>
                <td>Gasto</td>
                <td>R$ 180</td>

                <td>
                    <button class="editar">Editar</button>
                    <button class="excluir">Excluir</button>
                </td>
            </tr>

            </tbody>

        </table>

    </section>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

    <div class="modal-conteudo">

        <h2>Nova Transação</h2>

        <form id="form-transacao">

            <div class="input-group">

                <label for="nome">Nome</label>

                <input
                        type="text"
                        id="nome"
                        placeholder="Digite o nome da transação"
                >

            </div>

            <div class="input-group">

                <label for="data">Data</label>

                <input
                        type="date"
                        id="data"
                >

            </div>

            <div class="input-group">

                <label for="valor">Valor</label>

                <input
                        type="number"
                        id="valor"
                        placeholder="Digite o valor"
                >

            </div>

            <div class="input-group">

                <label for="categoria">Categoria</label>

                <select id="categoria">

                    <option>Alimentação</option>
                    <option>Transporte</option>
                    <option>Lazer</option>
                    <option>Trabalho</option>
                    <option>Adicionar categoria</option>

                </select>

            </div>

            <!-- CATEGORIA PERSONALIZADA -->

            <div
                    class="input-group"
                    id="nova-categoria-group"
            >

                <label for="nova-categoria">
                    Nova Categoria
                </label>

                <input
                        type="text"
                        id="nova-categoria"
                        placeholder="Digite a nova categoria"
                >

            </div>

            <div class="input-group">

                <label for="tipo">Tipo</label>

                <select id="tipo">

                    <option>Lucro</option>
                    <option>Gasto</option>

                </select>

            </div>

            <!-- BOTÕES -->

            <div class="modal-botoes">

                <button type="submit">
                    Salvar
                </button>

                <button
                        type="button"
                        id="fechar-modal"
                >
                    Cancelar
                </button>

            </div>

        </form>

    </div>

</div>

<script src="../static/js/gestao.js"></script>

</body>
</html>
